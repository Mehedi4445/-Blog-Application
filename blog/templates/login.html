{% extends "base.html" %}

{% block title %}Login - Django Blog{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 500px;">
    <h1 class="h2 mb-4 text-center">Login</h1>

    {% if form.errors %}
        <div class="alert alert-danger">
            Username or password is incorrect.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold" for="id_username">Username</label>
            <input type="text" name="username" id="id_username" class="form-control"
                   required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold" for="id_password">Password</label>
            <input type="password" name="password" id="id_password" class="form-control"
                   required>
        </div>

        <button type="submit" class="btn btn-dark w-100">Login</button>
    </form>

    <p class="text-center mt-4 mb-0">
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>
</div>
{% endblock %}
